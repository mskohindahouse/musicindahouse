<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Koh Make Music! - Secondary School Music Interactive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            purple: '#9A3412', // Earthy Orange-800
                            pink: '#B45309',   // Earthy Amber-700
                            cyan: '#4D7C0F',   // Earthy Lime-700
                            amber: '#A16207',  // Earthy Yellow-700
                            dark: '#292524'    // Stone-800
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .guitar-string { stroke: #A8A29E; stroke-linecap: round; }
        .ukulele-string { stroke: #D6D3D1; stroke-linecap: round; }
        .fret-line { stroke: #78716C; stroke-width: 2.5; }
        .nut-line { stroke: #F5F5F4; stroke-width: 6; }
        .dark .nut-line { stroke: #F5F5F4; }
        html:not(.dark) .nut-line { stroke: #44403C; }
        .finger-dot { fill: #B45309; stroke: #E6E0D8; stroke-width: 2; }
        .piano-key-white { fill: #F9F8F5; stroke: #57534E; stroke-width: 1; rx: 0 0 5 5; cursor: pointer; transition: all 0.15s ease; }
        .dark .piano-key-white { fill: #F9F8F5; stroke: #57534E; }
        .piano-key-black { fill: #292524; stroke: #1C1917; stroke-width: 1; rx: 0 0 4 4; cursor: pointer; transition: all 0.15s ease; }
        .piano-key-active { fill: #A3E635 !important; }
        .piano-key-black.piano-key-active { fill: #4D7C0F !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #78716C; border-radius: 9999px; }
        
        #tunerNeedle {
            transition: transform 0.08s ease-out;
            transform-origin: bottom center;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        input, select, textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }
        svg, img, a, button {
            -webkit-user-drag: none;
            user-drag: none;
        }
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body class="bg-[#DCD7D0] text-stone-800 dark:bg-stone-950 dark:text-stone-100 font-sans min-h-screen flex flex-col justify-between transition-colors duration-300">

    <header class="bg-[#F9F8F5]/95 dark:bg-stone-900/95 backdrop-blur-md border-b border-stone-300 dark:border-stone-800 sticky top-0 z-40 transition-colors duration-300 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-1.5 sm:py-2 flex items-center justify-between gap-2 xl:gap-3">
            <div class="flex items-center gap-2 sm:gap-2.5 min-w-0">
                <button id="sidePanelToggleBtn" type="button" onclick="toggleSidePanel()" aria-expanded="false" aria-controls="sidePanelDrawer" aria-label="Open sections menu" class="lg:hidden w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-stone-200 hover:bg-stone-300 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-800 dark:text-stone-200 border border-stone-300 dark:border-stone-700 flex items-center justify-center transition shrink-0">
                    <i class="fa-solid fa-bars text-xs sm:text-sm"></i>
                </button>

                <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-gradient-to-tr from-[#CB1517] to-[#FF4D4D] flex items-center justify-center text-[#E6E0D8] shadow-sm shadow-[#CB1517]/30 shrink-0">
                    <i class="fa-solid fa-music text-sm sm:text-base"></i>
                </div>

                <div class="min-w-0">
                    <h1 class="font-display font-bold text-base sm:text-lg leading-none text-[#CB1517] truncate">
                        Let's Koh Make Music!
                    </h1>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span class="text-[9px] sm:text-[10px] px-1.5 py-0 rounded-full bg-red-100 dark:bg-red-900/60 text-red-800 dark:text-red-300 border border-red-300 dark:border-red-700/50 font-normal leading-tight">Sec Music</span>
                        <span class="text-[10px] sm:text-[11px] text-stone-600 dark:text-stone-400 font-medium leading-none">version 2.1</span>
                    </div>
                </div>
            </div>

            <nav aria-label="Main Workspace Tabs" class="hidden lg:flex lg:items-center gap-1.5 xl:gap-2">
                <button id="bannerTabSongwriting" onclick="switchBannerTab('songwriting')" class="banner-tab-btn px-2.5 py-1.5 rounded-lg border-2 border-blue-600 bg-blue-50/90 dark:bg-blue-950/40 text-left transition-all flex items-center gap-2 shadow-sm">
                    <div class="w-6 h-6 rounded-md bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-pen-nib text-[11px]"></i>
                    </div>
                    <div class="min-w-0 leading-tight">
                        <div class="font-display font-bold text-xs text-stone-900 dark:text-[#E6E0D8] whitespace-nowrap">Songwriting</div>
                        <div class="text-[10px] text-stone-600 dark:text-stone-400 whitespace-nowrap">Chords &amp; Cajon</div>
                    </div>
                </button>

                <button id="bannerTabPractice" onclick="switchBannerTab('practice')" class="banner-tab-btn px-2.5 py-1.5 rounded-lg border-2 border-transparent hover:bg-stone-200/70 dark:hover:bg-stone-800/70 text-left transition-all flex items-center gap-2 opacity-80 hover:opacity-100">
                    <div class="w-6 h-6 rounded-md bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-sliders text-[11px]"></i>
                    </div>
                    <div class="min-w-0 leading-tight">
                        <div class="font-display font-bold text-xs text-stone-900 dark:text-[#E6E0D8] whitespace-nowrap">Practice Tools</div>
                        <div class="text-[10px] text-stone-600 dark:text-stone-400 whitespace-nowrap">Tuner &amp; Metronome</div>
                    </div>
                </button>

                <button id="bannerTabChords" onclick="switchBannerTab('chords')" class="banner-tab-btn px-2.5 py-1.5 rounded-lg border-2 border-transparent hover:bg-stone-200/70 dark:hover:bg-stone-800/70 text-left transition-all flex items-center gap-2 opacity-80 hover:opacity-100">
                    <div class="w-6 h-6 rounded-md bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-guitar text-[11px]"></i>
                    </div>
                    <div class="min-w-0 leading-tight">
                        <div class="font-display font-bold text-xs text-stone-900 dark:text-[#E6E0D8] whitespace-nowrap">Chord Charts</div>
                        <div class="text-[10px] text-stone-600 dark:text-stone-400 whitespace-nowrap">Ukulele &amp; Guitar</div>
                    </div>
                </button>

                <button id="bannerTabNoteRec" onclick="switchBannerTab('noterec')" class="banner-tab-btn px-2.5 py-1.5 rounded-lg border-2 border-transparent hover:bg-stone-200/70 dark:hover:bg-stone-800/70 text-left transition-all flex items-center gap-2 opacity-80 hover:opacity-100">
                    <div class="w-6 h-6 rounded-md bg-rose-100 dark:bg-rose-900/50 text-[#CB1517] dark:text-rose-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-music text-[11px]"></i>
                    </div>
                    <div class="min-w-0 leading-tight">
                        <div class="font-display font-bold text-xs text-stone-900 dark:text-[#E6E0D8] whitespace-nowrap">Note Recognition</div>
                        <div class="text-[10px] text-stone-600 dark:text-stone-400 whitespace-nowrap">Staff &amp; Pitch</div>
                    </div>
                </button>
            </nav>

            <button id="themeToggleBtn" onclick="toggleTheme()" class="flex items-center justify-center gap-1.5 text-xs bg-stone-200 hover:bg-stone-300 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-200 px-2.5 py-1.5 rounded-lg border border-stone-300 dark:border-stone-700 transition shrink-0">
                <i class="fa-solid fa-sun text-yellow-600 hidden dark:inline"></i>
                <i class="fa-solid fa-moon text-stone-600 dark:hidden"></i>
                <span id="themeText" class="font-medium text-[11px]">Dark</span>
            </button>
        </div>
    </header>

    <div id="sidePanelBackdrop" onclick="closeSidePanel()" class="fixed inset-0 z-50 bg-stone-950/50 backdrop-blur-xs hidden lg:hidden transition-opacity duration-200" aria-hidden="true"></div>

    <aside id="sidePanelDrawer" aria-label="Workspace Sections Drawer" class="fixed top-0 left-0 bottom-0 z-50 w-72 max-w-[82vw] bg-[#F9F8F5] dark:bg-stone-900 border-r border-stone-300 dark:border-stone-800 shadow-2xl transform -translate-x-full transition-transform duration-200 ease-out flex flex-col justify-between lg:hidden">
        <div class="px-3.5 py-2.5 border-b border-stone-300 dark:border-stone-800 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#CB1517] to-[#FF4D4D] flex items-center justify-center text-[#E6E0D8] shrink-0">
                    <i class="fa-solid fa-music text-sm"></i>
                </div>
                <div class="min-w-0">
                    <div class="font-display font-bold text-sm text-[#CB1517] truncate">Let's Koh Make Music!</div>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span class="text-[9px] px-1.5 py-0 rounded-full bg-red-100 dark:bg-red-900/60 text-red-800 dark:text-red-300 border border-red-300 dark:border-red-700/50">Sec Music</span>
                        <span class="text-[10px] text-stone-600 dark:text-stone-400 font-medium">version 2.1</span>
                    </div>
                </div>
            </div>
            <button id="sidePanelCloseBtn" type="button" onclick="closeSidePanel()" aria-label="Close sections menu" class="w-8 h-8 rounded-lg bg-stone-200 hover:bg-stone-300 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-200 flex items-center justify-center transition shrink-0">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="p-3 flex-1 overflow-y-auto flex flex-col gap-2">
            <button id="drawerTabSongwriting" type="button" onclick="selectSectionFromDrawer('songwriting')" class="drawer-tab-btn w-full px-3 py-2.5 rounded-xl border-2 border-blue-600 bg-blue-50/90 dark:bg-blue-950/40 text-left transition-all flex items-center gap-3 shadow-sm">
                <div class="w-8 h-8 rounded-lg bg-blue-100
